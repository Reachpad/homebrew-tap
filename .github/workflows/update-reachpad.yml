name: Update Reachpad formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reachpad-formula

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the latest Reachpad release
        id: update
        run: |
          ruby scripts/update-reachpad.rb
          if test -n "$(git status --porcelain)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Verification is inlined here rather than delegated to an external
      # gate. The three commands are unchanged; what goes away is a Rust
      # toolchain and a from-source cargo build on every release, installed
      # only to run three ruby one-liners.
      - name: Verify and publish the updated formula
        if: steps.update.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ruby --disable-gems -c Formula/reachpad.rb
          ruby --disable-gems -c scripts/update-reachpad.rb
          ruby --disable-gems scripts/update-reachpad.rb --check
          version=$(ruby -ne 'puts $1 if $_ =~ /^  version "([^"]+)"$/' Formula/reachpad.rb)
          git config user.name "reachpad-release-bot"
          git config user.email "release-bot@reachpad.dev"
          git commit -am "Update Reachpad to ${version}"
          git push
